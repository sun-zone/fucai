server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fucai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

fucai:
  ssq-url: https://datachart.500.com/ssq/
  ssq-history-url: https://datachart.500.com/ssq/history/newinc/history.php
  dlt-history-url: https://datachart.500.com/dlt/history/newinc/history.php
  kl8-history-url: https://datachart.500.com/kl8/zoushi/newinc/jbzs_redblue.php
  kl8-draw-date-url: https://www.swlc.net.cn/lottery/kl8.html
  kl8-weight-cron: "0 30 3 * * ?"
